<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Your triathlon training plan, built and adapted like a coach would." />
    <meta name="theme-color" content="#4338ca" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="TriTrain" />
    <title>TriTrain</title>
    <script>
      // Apply a picked theme before the app loads, so the page never flashes the wrong one.
      try {
        var theme = localStorage.getItem('tritrain.theme')
        if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
